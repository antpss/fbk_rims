# ===================================================================
# RIMS+ Central Configuration File
# ===================================================================

project:
  name: "BPI_2012"
  random_seed: 42

paths:
  raw_log: "data/processed/BPI_2012_W_only.xes"
  aligned_log: "data/processed/aligned_BPI_2012.xes"
  petri_net: "models/petri_nets/discovered_model_split.pnml"
  petri_nets_dir: "models/petri_nets"
  output_base_dir: "data/processed"
  models_dir: "models"

# Process Discovery Settings
discovery:
  miner: "split"                  # Options: "split", "inductive"
  inductive_noise_threshold: 0.2  # Noise threshold for inductive miner

# Feature Engineering Settings
features:
  prefix_window_size: 10          # History window of past activities (trace prefix)
  
  # Tier 1: Universal Features (Calculated from standard XES schema)
  universal:
    use_wip: true                 # Process-level active case count (WIP)
    use_ac_wip: true              # Activity-level active case count (AC_WIP)
    use_role_occupancy: true      # Relative role occupancy (Role_*_OC)
    use_calendar_time: true       # Daytime (0-1) and Weekday (one-hot)
    use_prev_duration: true       # Duration of previous activity in trace

  # Tier 2: Domain-Specific Attributes
  # Empty list [] will completely exclude domain attributes, making the pipeline strictly agnostic.
  case_attributes:
    - column: "case:AMOUNT_REQ"
      feature_name: "RequestedAmount"
      type: "continuous"
      fill_value: 0.0

  # Event-level attributes (e.g. Resource_ID, cost, channel). Empty by default for resource-agnostic modeling.
  event_attributes: []

# Human activities to model
target_activities:
  - "W_Assess fraud"
  - "W_Call after incomplete files"
  - "W_Call after offers"
  - "W_Complete application"
  - "W_Handle leads"
  - "W_Validate application"

# ===================================================================
# Config-Driven Task Specifications
# Controls zero-handling, targets, and sample weighting per task
# ===================================================================
tasks:
  duration:
    description: "Activity processing time duration prediction"
    target_column: "Duration_Seconds"
    output_file: "datasets/dataset_duration_global.csv"
    filter_zero_duration: true    # Drop instant automated/pass-through events
    sample_weighting:
      enabled: true
      smoothing: "sqrt"           # Options: "sqrt", "linear", "none"
      max_weight_cap: 8.0         # Hard ceiling to prevent rare activity gradient explosion
      output_weights_file: "datasets/activity_weights.json"

  waiting_time:
    description: "Queue / waiting time before activity starts"
    target_column: "Wait_Time_Seconds"
    output_file: "datasets/dataset_waiting_time_global.csv"
    filter_zero_duration: false   # Zero waiting time is physically valid (immediate pickup)
    sample_weighting:
      enabled: false

  routing:
    description: "Decision point / next activity prediction at XOR splits"
    target_column: "Next_Activity"
    output_file: "datasets/dataset_routing_global.csv"
    filter_zero_duration: false
    sample_weighting:
      enabled: false

    # Step 05: Decision Mining & Routing Settings
    # CLI Overrides: python src/05_train_routing.py --classifier decision_tree --min_samples 50
    classifier_type: "xgboost"    # Classifier engine: "xgboost" (high accuracy) or "decision_tree" (interpretable)
    min_samples: 30               # Minimum samples at an XOR place required to train an ML model (otherwise fallback to probability)
    min_f1_threshold: 0.60        # Quality threshold: Macro F1 >= 0.60 saves ML model; < 0.60 falls back to empirical branching probabilities
    output_dir: "models/routing"

# ===================================================================
# Model Strategy & Architecture (Step 04)
# Controls Global, Local, and Heterogeneous Multi-Tier Hybrid dispatching
# ===================================================================
model_strategy:
  strategy: "hybrid"              # Strategy: "global", "local", or "hybrid"
  model_type: "xgboost"           # Default engine: "xgboost", "lstm", "tcn", or "transformer"

  # Deep Learning Training Hyperparameters
  dl:
    epochs: 50 
    patience: 10  
    batch_size: 256 
    learning_rate: 0.001

  # Heterogeneous Multi-Tier Hybrid Configuration:
  # Allocates architectures based on activity volume in dataset:
  # - High Volume Tier: Local XGBoost (fastest training, superior tabular precision)
  # - Medium Volume Tier: Local TCN (captures complex sequential patterns with adequate data)
  # - Sparse Tier: Global DL (pooled cross-activity transfer learning for data-starved classes)
  hybrid:
    tier_thresholds:
      high_min_samples: 15000     # >= 15,000 samples -> High Volume Tier (Local XGBoost)
      medium_min_samples: 5000    # 5,000 to 14,999 samples -> Medium Volume Tier (Local TCN)
                                  # < 5,000 samples -> Sparse Tier (Global DL)
    tier_models:
      high_volume: "xgboost"      # Trained as a Local model
      medium_volume: "tcn"        # Trained as a Local model
      sparse: "tcn"               # Trained as a Global pooled model

    # Optional manual activity override (if uncommented, overrides thresholds):
    # explicit_assignments:
    #   "W_Complete application": "local_xgboost"
    #   "W_Call after offers": "local_xgboost"
    #   "W_Call after incomplete files": "local_tcn"
    #   "W_Validate application": "global_tcn"
    #   "W_Handle leads": "global_tcn"
    #   "W_Assess fraud": "global_tcn"

