# ===================================================================
# RIMS++ Central Configuration File
# ===================================================================

project:
  name: "BPI_2012"
  random_seed: 42

paths:
  # General Process & Duration / Waiting Time paths
  raw_log: "data/processed/BPI_2012_filtered.xes"
  aligned_log: "data/processed/aligned_BPI_2012.xes"
  petri_net: "models/petri_nets/discovered_model_split.pnml"
  petri_nets_dir: "models/petri_nets"
  output_base_dir: "data/processed"
  models_dir: "models"

  # Milestone Lifecycle Log (Step 00 export destination for milestone traces)
  milestone_log: "data/processed/BPI_2012_A_only.xes"

  # Routing Decision Point paths (Step 05 Decision Mining)
  routing_train_log: "data/processed/aligned_BPI_2012.xes"
  routing_petri_net: "models/petri_nets/discovered_model_split.pnml"
  routing_models_dir: "models/routing"

# Process Discovery Settings (Split Miner)
discovery:
  split_miner:
    epsilon: 0.1
    eta: 0.4
    minimize_or_joins: true
    variant: "classic"

# Organizational Role Discovery & Resource Settings
resources:
  discovery:
    algorithm: "sperduti"           # Options: "sperduti", "manual"
    threshold: 0.35                 # Aggregation threshold (Burattin et al. 2013): 0.35 -> 3 macro roles; >= 0.60 -> 1 role per activity
    output_file: "models/role_mapping.json"
    report_file: "models/role_discovery_report.md"
  simulation:
    mode: "hybrid_sperduti"         # Options: "hybrid_sperduti" (route by role, dispatch to multi-skilled named workers), "legacy_anonymous", "activity_isolated"
    dispatch_policy: "longest_idle_first"
    enable_concurrency_quotas: true # Allows multi-tasking (C_w >= 1) mined from log to prevent artificial serialization


# Feature Engineering Settings
features:
  prefix_window_size: 10          # History window of past activities (trace prefix)

  # Option A: Modular Feature Selection (Registry Pattern)
  # When selected_features is defined, RIMS++ extracts and trains exclusively on these features.
  # Available:
  #   - wip              (Process-level active case count)
  #   - ac_wip           (Activity-level active case count)
  #   - daytime          (Daytime normalized in [0, 1])
  #   - weekday          (One-hot weekday indicators Weekday_0..6)
  #   - role_occupancy   (Concurrent role/activity utilization vector Role_*_OC)
  #   - prev_duration    (Duration of previous activity in trace)
  #   - offer_count      (Business milestone offer count)
  #   - has_offer        (Binary indicator if case has an offer)
  #   - milestones       (Binary indicators for milestones seen)
  #   - case_attributes  (Domain-specific case attributes, e.g. RequestedAmount)
  #   - resource_id      (Worker/resource identity)
  selected_features:
    - wip
    - ac_wip
    - daytime
    - weekday
    - role_occupancy
    - prev_duration
    - case_attributes
    - milestones
    # - resource_id

  # Tier 1: Universal Features (Fallback if selected_features is omitted)
  universal:
    use_wip: true                 # Process-level active case count (WIP)
    use_ac_wip: true              # Activity-level active case count (AC_WIP)
    use_role_occupancy: true      # Relative role occupancy (Role_*_OC)
    use_calendar_time: true       # Daytime (0-1) and Weekday (one-hot)
    use_prev_duration: true       # Duration of previous activity in trace

  # Tier 2: Domain-Specific Attributes
  # Empty list [] will completely exclude domain attributes.
  case_attributes:
    - column: "case:AMOUNT_REQ"
      feature_name: "RequestedAmount"
      type: "continuous"
      treat_zero_as_missing: true
      fill_strategy: "median"
      fill_value: 0.0

  # Event-level attributes (e.g. Resource_ID, cost, channel).
  event_attributes: []

# ===================================================================
# Preprocessing & Log Filtering (Step 00)
# ===================================================================
preprocessing:
  input_log: "data/raw/BPI_Challenge_2012.xes"
  # Activities discovered in Petri Net & modeled for duration/waiting simulation
  # DEFAULT: Set to [] or omit to model ALL activities in the log.
  # For BPI 2012: ["W_"] isolates human work items.
  process_activity_prefixes:
    - "W_"
  # Milestone activities preserved as business state context for routing classifiers
  # DEFAULT: Set to [] or omit if the log has no separate milestone events.
  # For BPI 2012: ["A_", "O_"] captures application & offer business status.
  milestone_prefixes:
    - "A_"
    - "O_"

  # Empirical distribution of initial milestone profiles observed upon case submission
  initial_milestones_distribution:
    - milestones: ["A_SUBMITTED", "A_PARTLYSUBMITTED", "A_PREACCEPTED"]
      probability: 0.35
    - milestones: ["A_SUBMITTED", "A_PARTLYSUBMITTED"]
      probability: 0.65

  # Dynamic progression: milestones achieved when human tasks complete
  milestone_progression:
    "W_Complete application":
      "A_ACCEPTED": 1.0
      "O_SELECTED": 1.0
      "A_FINALIZED": 0.15
      "O_CREATED": 0.15
      "O_SENT": 0.15
    "W_Call after offers":
      "O_SENT_BACK": 0.15

  # Terminal outcome milestones excluded from decision routing to avoid target leakage
  excluded_milestones:
    - "O_ACCEPTED"
    - "A_DECLINED"
    - "A_CANCELLED"
    - "A_ACTIVATED"
    - "A_APPROVED"
    - "A_REGISTERED"
    - "O_DECLINED"
    - "O_CANCELLED"

  # Optional activity renaming/translation map. Empty {} applies no renaming.
  activity_mapping:
    "W_Afhandelen leads": "W_Handle leads"
    "W_Completeren aanvraag": "W_Complete application"
    "W_Valideren aanvraag": "W_Validate application"
    "W_Nabellen offertes": "W_Call after offers"
    "W_Beoordelen fraude": "W_Assess fraud"
    "W_Wijzigen contractgegevens": "W_Change contract details"
    "W_Nabellen incomplete dossiers": "W_Call after incomplete files"

# Activities to model (Duration, Waiting Time, Routing)
# If empty list [] or omitted, RIMS++ automatically discovers and models all activities in the log.
target_activities: []

# ===================================================================
# Config-Driven Task Specifications
# Controls zero-handling, targets, and sample weighting per task
# ===================================================================
tasks:
  duration:
    description: "Activity processing time duration prediction"
    target_column: "Duration_Seconds"
    output_file: "datasets/dataset_duration_global.csv"
    filter_zero_duration: true    # Drop instant automated/pass-through events
    sample_weighting:
      enabled: true
      smoothing: "sqrt"           # Options: "sqrt", "linear", "none"
      max_weight_cap: 8.0         # Hard ceiling to prevent rare activity gradient explosion
      output_weights_file: "datasets/activity_weights.json"

  waiting_time:
    description: "Queue / waiting time before activity starts"
    target_column: "Wait_Time_Seconds"
    output_file: "datasets/dataset_waiting_time_global.csv"
    filter_zero_duration: false   # Zero waiting time is physically valid (immediate pickup)
    sample_weighting:
      enabled: false

  routing:
    description: "White-Box XOR decision point routing classifiers"
    classifier_type: "decision_tree" # Default: "decision_tree" (white-box), options: "decision_tree", "random_forest", "xgboost"
    inference_mode: "argmax"         # Options: "sample" (probabilistic leaf sampling), "argmax" (deterministic rule execution)
    mode: "payload"                  # Options: "payload" (RequestedAmount), "inter_arrival", "both"
    max_depth: 21                    # Depth search ceiling for hyperparameter optimization (RIMS space: 1..21)
    rf_trees: 5                      # Number of trees for random_forest
    min_samples: 30                  # Minimum samples at an XOR place required to train an ML model (otherwise fallback to probability)
    min_f1_threshold: 0.60           # Quality threshold: Macro F1 >= 0.60 saves ML model; < 0.60 falls back to empirical branching probabilities
    output_dir: "models/routing"
    # Optional decision places to force empirical branching probabilities (parity with legacy RIMS entry split)
    force_probability_places:
      - "exi_xor_1"
      - "exi_W_Handle leads__loop_split"

# ===================================================================
# Model Strategy & Architecture (Step 04)
# Configures training mode: hybrid champion, global tournament, or single global
# ===================================================================
model_strategy:
  # Execution Mode:
  # - "hybrid": Trains global + local candidates, synthesizes per-activity hybrid champion
  # - "global_tournament": Trains only global engines (e.g. XGB vs TCN), crowns the best global model
  # - "single_global": Fast baseline, trains only one selected global engine
  mode: "hybrid"
  split_strategy: "temporal"      # Options: "temporal" (chronological out-of-time split), "random" (case-level random split)

  # Used only when mode: "single_global"
  single_global_engine: "xgboost" # Options: "xgboost", "tcn", "lstm"

  # Deep Learning Training Hyperparameters (TCN / LSTM)
  dl:
    epochs: 50 
    patience: 5  
    batch_size: 256 
    learning_rate: 0.001
    min_delta: 0.01                 # Minimum relative improvement (1.0%) to reset early stopping patience
    min_samples_for_local_dl: 3000  # Minimum samples to train local DL (based on NeurIPS 2022 tabular benchmark)

  # Candidate architectures per mode
  candidates:
    hybrid:
      - strategy: "global"
        engine: "xgboost"
      - strategy: "local"
        engine: "xgboost"
      - strategy: "global"
        engine: "tcn"
      - strategy: "local"
        engine: "tcn"
      - strategy: "global"
        engine: "lstm"
      - strategy: "local"
        engine: "lstm"
    global_tournament:
      - strategy: "global"
        engine: "xgboost"
      - strategy: "global"
        engine: "tcn"
      - strategy: "global"
        engine: "lstm"

# ===================================================================
# Discrete-Event Simulation Settings (Step 06)
# ===================================================================
simulation:
  mode: "hybrid_residual"         # Options: "hybrid_residual", "pure_physics"
  duration_simulation: null       # Duration horizon in days (RIMS duration_simulation). If null, bounded by num_cases
  num_cases: 1000                 # Number of cases to simulate (null for all cases)
  max_events_per_case: 80         # Safety ceiling to prevent non-terminating loops
  output_simulated_log: "data/generated/csv/simulated_log.csv"
  export_xes: true                # Also export standard IEEE XES log (.xes)
  output_simulated_xes: "data/generated/xes/simulated_log.xes"

  # Extraneous Activity Delays (Chapela-Campa & Dumas)
  extraneous_delays:
    enabled: true                 # Simulate discovered extraneous activity delays
    estimator: "eclaw_plus"       # Options: "eclaw_plus", "eclaw", "naive"
    placement: "ex_ante"          # Options: "ex_ante", "ex_post", "causal_pair"
    include_internal_queue_delays: false # If true, also simulates internal queue delays
  
  # Human Inter-Ticket Latency (Worker Refractory Cooldowns / Coffee Breaks)
  human_latency:
    enabled: true                 # Simulate post-task refractory periods (coffee breaks)
    queue_aware: true             # Queue-aware: only take break when queue has no pending tickets
    max_cooldown_seconds: 1800.0  # Max cooldown ceiling
  
  # Arrival Configuration (Replay historical timeline vs. Generative distribution vs. Prophet forecasting)
  arrival:
    mode: "prophet"                   # Options: "replay" (replays from aligned_log), "generative" (statistical distribution), "prophet" (Facebook Prophet time-series)
    distribution: "exponential"   # Distribution for generative mode: "exponential", "uniform", "constant"
    scale: 300.0                  # Mean seconds between case arrivals (e.g. 300s = 5 min)
    start_timestamp: "2012-01-01 08:00:00"
    calendar_bounded: false       # If true, new arrivals only spawn during office hours (false allows 24/7 natural customer submissions)

    # Facebook Prophet Time-Series Forecasting Settings (used when mode: "prophet")
    prophet:
      growth: "logistic"                  # Trend growth model: "logistic" or "linear"
      cap_multiplier: 1.25                # Carrying capacity multiplier: cap = max_hourly_arrivals * cap_multiplier
      sampling_method: "triangular"       # Hourly count sampling: "triangular", "poisson", "round"
      changepoint_prior_scale: 0.05       # Flexibility of trend changepoints (default: 0.05)
      seasonality_prior_scale: 10.0       # Strength of seasonality model (default: 10.0)
      daily_seasonality: true             # Model diurnal intra-day arrival variations
      weekly_seasonality: true            # Model weekly / day-of-week arrival variations
      intra_hour_distribution: "uniform"  # Intra-hour case arrival dispersion: "uniform" or "normal"
      cache_model: true                   # Enable disk serialization and caching of fitted model
      model_cache_dir: "models/prophet"   # Directory for cached model JSON and metadata

  # Business Hours & Calendar Settings
  calendar:
    enabled: true                 # If true, shifts work to business hours & pauses weekends
    work_days: [0, 1, 2, 3, 4]    # Monday (0) to Friday (4)
    hour_start: 8                 # 08:00
    hour_end: 20                  # 20:00

    # 3-Tier Resolution Hierarchy:
    # Tier 1 (Highest): Explicit per_role configuration below.
    # Tier 2: Discovered role calendars from models/role_mapping.json (active if use_discovered_role_calendars: true).
    # Tier 3 (Fallback): Global calendar (work_days, hour_start, hour_end above).
    # IMPORTANT: Changing role calendars requires re-running Steps 02b, 03, and 04 so training features match simulation.
    use_discovered_role_calendars: false

    # Optional Per-Role / Per-Activity Calendars (Tier 1 overrides)
    # If not specified for a role/activity, it defaults to Tier 2 (if enabled) or Tier 3 global calendar.
    per_role: {}

    # For example:
    # per_role:
    #   "Role_0_FrontOffice_Processing":
    #     work_days: [0, 1, 2, 3, 4]
    #     hour_start: 8
    #     hour_end: 20
    #   "Role_1_Validation_Underwriting":
    #     work_days: [0, 1, 2, 3, 4]
    #     hour_start: 9
    #     hour_end: 17
    #   "Role_2_Fraud_Squad":
    #     work_days: [0, 1, 2, 3, 4]
    #     hour_start: 8
    #     hour_end: 16



